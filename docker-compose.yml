services:
  domain-manager:
    image: xiaoman1221/domain-manager:latest
    container_name: domain-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_PATH=/app/data/domain.db
      # IMPORTANT: set JWT_KEY to a strong random value (e.g. `openssl rand -hex 32`).
      # If it is not set, a random key is generated on startup and all users are
      # logged out every time the container restarts.
      - JWT_KEY=${JWT_KEY:-}
      # Initial defaults only: after first startup these are stored in the
      # database (system_settings) and managed in 个人设置 -> 系统管理 -> 系统设置.
      - WHOIS_API_URL=http://whois:3000
      - ICP_API_URL=http://icp:16181
    depends_on:
      - whois
      - icp

  whois:
    image: programzmh/next-whois-ui
    container_name: whois
    restart: unless-stopped

  icp:
    image: yiminger/ymicp
    container_name: icp
    restart: unless-stopped
