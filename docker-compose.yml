services:
  domain-manager:
    build: .
    container_name: domain-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_PATH=/app/data/domain.db
      - JWT_KEY=domain-manager-secret-key-2026
      - WHOIS_API_URL=http://whois:3000
      - ICP_API_URL=http://icp:16181
    depends_on:
      - whois
      - icp

  whois:
    image: programzmh/next-whois-ui
    container_name: whois
    restart: unless-stopped

  icp:
    image: yiminger/ymicp
    container_name: icp
    restart: unless-stopped
